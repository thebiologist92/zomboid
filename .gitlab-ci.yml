stages:
  - package

variables:
  GIT_CHECKOUT: "false"
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CLONE_EXTRA_FLAGS: "--filter=blob:none"

package_unified_carts:
  stage: package
  image: alpine:3.20
  script: |
    apk add --no-cache zip curl git unzip
    git checkout "$CI_COMMIT_SHA"
    git sparse-checkout init --cone
    git sparse-checkout set steamapps/workshop/content/108600/3651954650/mods/SaucedCarts/42 steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42
    git checkout "$CI_COMMIT_SHA"
    rm -rf build/UnifiedCarts
    mkdir -p build/UnifiedCarts/42
    cp -a steamapps/workshop/content/108600/3651954650/mods/SaucedCarts/42/. build/UnifiedCarts/42/
    mkdir -p build/UnifiedCarts/42/media/lua/shared/MyCartAddon
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/lua/shared/MyCartAddon/init.lua build/UnifiedCarts/42/media/lua/shared/MyCartAddon/init.lua
    mkdir -p build/UnifiedCarts/42/media/models_X/weapons/2handed
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/models_X/weapons/2handed/TrolleyCart.fbx build/UnifiedCarts/42/media/models_X/weapons/2handed/
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/models_X/weapons/2handed/TrolleyCartFull.fbx build/UnifiedCarts/42/media/models_X/weapons/2handed/
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/models_X/weapons/2handed/TrolleyCartPartial.fbx build/UnifiedCarts/42/media/models_X/weapons/2handed/
    mkdir -p build/UnifiedCarts/42/media/scripts
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/scripts/items_saucedtrolley.txt build/UnifiedCarts/42/media/scripts/
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/scripts/models_saucedtrolley.txt build/UnifiedCarts/42/media/scripts/
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/scripts/recipes_saucedtrolley.txt build/UnifiedCarts/42/media/scripts/
    mkdir -p build/UnifiedCarts/42/media/textures/weapons/2handed
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/textures/Item_TrolleyCart.png build/UnifiedCarts/42/media/textures/
    cp steamapps/workshop/content/108600/3653487630/mods/SaucedTrolleys/42/media/textures/weapons/2handed/TrolleyCart_Atlas.png build/UnifiedCarts/42/media/textures/weapons/2handed/
    fetch_raw() {
      p="$1"
      out="$2"
      enc=$(printf '%s' "$p" | sed 's|/|%2F|g')
      curl --fail --location --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/$enc/raw?ref=$CI_COMMIT_REF_NAME&lfs=true" -o "$out"
    }
    base="steamapps/workshop/content/108600"
    dest="build/UnifiedCarts/42"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/models_x/weapons/2handed/ShoppingCartFull_HandTorch.fbx" "$dest/media/models_x/weapons/2handed/ShoppingCartFull_HandTorch.fbx"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/models_x/weapons/2handed/ShoppingCartFull_PZ.fbx" "$dest/media/models_x/weapons/2handed/ShoppingCartFull_PZ.fbx"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/models_x/weapons/2handed/ShoppingCartHalfFull_HandTorch.fbx" "$dest/media/models_x/weapons/2handed/ShoppingCartHalfFull_HandTorch.fbx"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/models_x/weapons/2handed/ShoppingCartHalfFull_PZ.fbx" "$dest/media/models_x/weapons/2handed/ShoppingCartHalfFull_PZ.fbx"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/models_x/weapons/2handed/ShoppingCart_HandTorch.fbx" "$dest/media/models_x/weapons/2handed/ShoppingCart_HandTorch.fbx"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/models_x/weapons/2handed/ShoppingCart_PZ.fbx" "$dest/media/models_x/weapons/2handed/ShoppingCart_PZ.fbx"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/textures/Item_ShoppingCart.png" "$dest/media/textures/Item_ShoppingCart.png"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/textures/weapons/2handed/ShoppingCart_Atlas.png" "$dest/media/textures/weapons/2handed/ShoppingCart_Atlas.png"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/media/texturepacks/SaucedCarts.pack" "$dest/media/texturepacks/SaucedCarts.pack"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/poster.png" "$dest/poster.png"
    fetch_raw "$base/3651954650/mods/SaucedCarts/42/icon.png" "$dest/icon.png"
    fetch_raw "$base/3653487630/mods/SaucedTrolleys/42/media/models_X/weapons/2handed/TrolleyCart.fbx" "$dest/media/models_X/weapons/2handed/TrolleyCart.fbx"
    fetch_raw "$base/3653487630/mods/SaucedTrolleys/42/media/models_X/weapons/2handed/TrolleyCartFull.fbx" "$dest/media/models_X/weapons/2handed/TrolleyCartFull.fbx"
    fetch_raw "$base/3653487630/mods/SaucedTrolleys/42/media/models_X/weapons/2handed/TrolleyCartPartial.fbx" "$dest/media/models_X/weapons/2handed/TrolleyCartPartial.fbx"
    fetch_raw "$base/3653487630/mods/SaucedTrolleys/42/media/textures/Item_TrolleyCart.png" "$dest/media/textures/Item_TrolleyCart.png"
    fetch_raw "$base/3653487630/mods/SaucedTrolleys/42/media/textures/weapons/2handed/TrolleyCart_Atlas.png" "$dest/media/textures/weapons/2handed/TrolleyCart_Atlas.png"
    cat > build/UnifiedCarts/42/mod.info <<'EOF'
    name=Unified Carts - SaucedCarts + SaucedTrolleys
    id=UnifiedCarts
    author=Dark Sauce / unified build
    description=Standalone merge of SaucedCarts and SaucedTrolleys. Includes pushable shopping carts and trolleys.
    poster=poster.png
    icon=icon.png
    modversion=0.1.3
    versionMin=42.15.0
    pack=SaucedCarts
    incompatible=TMC_Trolley
    EOF
    sed -i 's/offset = -0.4800 0.4300 -0.0700,/offset = -0.4800 -0.4300 -0.0700,/g' build/UnifiedCarts/42/media/scripts/models_saucedtrolley.txt
    cd build
    zip -qr ../UnifiedCarts_SaucedMerged_v0.1.3.zip UnifiedCarts
    cd ..
    unzip -t UnifiedCarts_SaucedMerged_v0.1.3.zip
    curl --fail --location --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --form "file=@UnifiedCarts_SaucedMerged_v0.1.3.zip" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/uploads"
  artifacts:
    when: always
    paths:
      - UnifiedCarts_SaucedMerged_v0.1.3.zip
    expire_in: 7 days
